<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemin:Pas Online du tout</title>
    <link rel="icon" type="image/png" href="favicon_pokemin_32x32.png">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div id="header" style="display: grid;grid-template-rows: auto auto;">
        <div style="display:flex; justify-content:end">
            <!-- Fenêtre modale -->
            <div id="myModal" class="modal" display="none">
                <div class="modal-content" onclick="event.stopPropagation()">
                    <span id="close" onclick="closeModal()">X</span>
                    <div id="modalFormContainer"></div>
                </div>
            </div>
            <h1 class="pokemon-font">PoKeMiN</h1>
            <div id="loginArea"></div>
        </div>
        <div style="display: flex; ">
            <div id="user-info" style="display: flex; gap: 10px; margin-bottom: 10px;"></div>
        </div>
    </div>
    <div id="main" style="display: flex;gap: 10px;">
        <div id="pokemin1" style=" flex: 1;border: 1px solid #000;padding: 10px; background-color: rgba(255, 255, 255, 0.9);">
        </div>
        <div id="pokemin2" style="flex: 1;border: 1px solid #000;padding: 10px;background-color: rgba(255, 255, 255, 0.9);">
        </div>
    </div>
    <div id="footer"></div>

    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            manageLoginArea();
            initCombat();
        });
    </script>
</body>

</html>
